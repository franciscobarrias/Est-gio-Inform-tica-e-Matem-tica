<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Plataforma GBM — Serviço de Neurocirurgia CHSJ</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="topo">
    <div><strong>RISE-HEALTH / Serviço de Neurocirurgia CHSJ</strong><br />Monitorização longitudinal de glioblastoma</div>
  </header>

  <main>
    <section id="ecraLogin" class="card" style="max-width:480px;margin:2rem auto" aria-labelledby="tituloLogin">
      <h1 id="tituloLogin">Entrar na plataforma</h1>
      <p>Protótipo com contas e dados fictícios. Palavra-passe de demonstração: <code>123456</code>.</p>
      <div class="acoes" style="margin-bottom:1rem">
        <button type="button" class="secundario" data-email="medico@chsj.pt">Médico</button>
        <button type="button" class="secundario" data-email="enfermeiro@chsj.pt">Enfermeiro</button>
        <button type="button" class="secundario" data-email="doente@chsj.pt">Doente</button>
        <button type="button" class="secundario" data-email="cuidador@chsj.pt">Cuidador</button>
      </div>
      <form id="formLogin">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" required value="medico@chsj.pt" />
        <label for="password">Palavra-passe</label>
        <input id="password" type="password" autocomplete="current-password" required value="123456" />
        <button type="submit" style="width:100%">Iniciar sessão</button>
      </form>
      <p id="msgErroLogin" class="error" role="alert" aria-live="polite"></p>
    </section>
  </main>

  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
